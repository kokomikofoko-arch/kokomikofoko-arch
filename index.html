<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome 🫧❄️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f8fb;
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        .welcome-card {
            position: relative;
            background: #ffffff;
            padding: 50px 65px;
            border-radius: 30px;
            text-align: center;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0, 119, 182, 0.08);
            z-index: 10;
            border: 2px solid transparent;
            background-image: linear-gradient(#ffffff, #ffffff), 
                              linear-gradient(135deg, #0077b6, #48cae4, #90e0ef);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            width: 340px;
        }

        .card-tag {
            position: absolute;
            top: -12px;
            right: 20px;
            background: #0077b6;
            color: #fff;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0, 119, 182, 0.3);
        }

        .main-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 25px;
            filter: drop-shadow(0 5px 10px rgba(0,119,182,0.15));
            transition: transform 0.1s ease;
            cursor: pointer;
        }
        
        .main-icon.active {
            transform: scale(1.15);
        }

        .text {
            font-size: 13px;
            letter-spacing: 1px;
            color: #1d3557;
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 20px;
        }

        .power-meter-container {
            width: 100%;
            height: 14px;
            background: #e2eafc;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .power-meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0077b6, #48cae4);
            border-radius: 7px;
            transition: width 0.4s ease-out;
        }

        .click-instruction {
            font-size: 11px;
            color: #6c757d;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .footer-text {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #6c757d;
            user-select: none;
            z-index: 10;
        }

        .exploding-star {
            position: absolute;
            font-size: 20px;
            animation: burstOut 0.8s ease-out forwards;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes burstOut {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.1) rotate(720deg);
                opacity: 0;
            }
        }

        body.fade-out {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="card-tag">WELCOME</div>
        <span class="main-icon" id="interactiveBtn">🫧</span>
        <div class="text" id="statusText">จิ้มให้เต็ม...เพื่อไปต่อ</div>
        <div class="power-meter-container">
            <div class="power-meter-fill" id="powerFill"></div>
        </div>
        <div class="click-instruction" id="subInstruction">คลิกที่ฟองสบู่รัวๆ!</div>
    </div>

    <div class="footer-text">est. 2026  ·  made with ♡</div>

    <script>
        const interactiveBtn = document.getElementById('interactiveBtn');
        const powerFill = document.getElementById('powerFill');
        const statusText = document.getElementById('statusText');
        const subInstruction = document.getElementById('subInstruction');
        const body = document.body;

        let currentClick = 0;
        const totalSteps = 13; // 10 รอบฟองสบู่ + 3 รอบหิมะกวนๆ
        let isCompleted = false;

        interactiveBtn.addEventListener('click', function() {
            if (isCompleted) return;

            interactiveBtn.classList.add('active');
            setTimeout(() => interactiveBtn.classList.remove('active'), 100);

            currentClick++;

            // คำนวณหลอดพลัง (คิดจาก 10 ขั้นแรก)
            let fillProgress = Math.min(currentClick, 10) / 10 * 100;
            powerFill.style.width = fillProgress + '%';

            // จัดการข้อความตามสเต็ป
            if (currentClick <= 10) {
                statusText.innerText = `จิ้มให้เต็ม...เพื่อไปต่อ (${currentClick}/10)`;
                if (currentClick === 10) {
                    // เปลี่ยนร่างเป็นเกล็ดหิมะ ❄️ เข้าสู่ 3 รอบสุดท้าย
                    interactiveBtn.innerText = '❄️';
                    statusText.innerText = 'เอ๊ะ เกือบละ... ขออีกนิดนึงน่า';
                    subInstruction.innerText = 'เก็บเกล็ดหิมะแรกกัน!';
                }
            } else if (currentClick === 11) {
                statusText.innerText = 'แหน่... ยังไม่ยอมให้ไปหรอก 🤭';
                subInstruction.innerText = 'กดอีกรอบสิ เจ้ามนุษย์!';
            } else if (currentClick === 12) {
                statusText.innerText = 'แกล้งเฉยๆ หรอกหน่า อีกทีๆ ✨';
                subInstruction.innerText = 'ครั้งสุดท้ายจริงๆ แล้ว!';
            } else if (currentClick >= 13) {
                isCompleted = true;
                statusText.innerText = 'ปิ๊ง! ไปลุยกันเลย 🚀';
                subInstruction.innerText = 'กำลังพาไปหน้าไบโอ...';
                
                explodeStars();
                
                setTimeout(function() {
                    body.classList.add('fade-out');
                }, 500);

                setTimeout(function() {
                    window.location.href = 'bio.html';
                }, 1100);
            }
        });

        function explodeStars() {
            const cardRect = interactiveBtn.getBoundingClientRect();
            const centerX = cardRect.left + cardRect.width / 2;
            const centerY = cardRect.top + cardRect.height / 2;

            for (let i = 0; i < 25; i++) {
                let star = document.createElement('div');
                star.className = 'exploding-star';
                star.innerHTML = '✨';

                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                star.style.setProperty('--tx', `${tx}px`);
                star.style.setProperty('--ty', `${ty}px`);
                star.style.left = centerX - 10 + 'px';
                star.style.top = centerY - 10 + 'px';
                star.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';

                document.body.appendChild(star);

                setTimeout(() => {
                    star.remove();
                }, 1000);
            }
        }
    </script>

</body>
</html>
