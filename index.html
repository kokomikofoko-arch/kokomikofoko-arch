<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome 🤍</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #faf8f5;
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        .welcome-card {
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .welcome-card:hover {
            transform: scale(1.08);
        }

        .bow {
            font-size: 75px;
            display: block;
            margin-bottom: 12px;
        }

        .text {
            font-size: 14px;
            letter-spacing: 2px;
            color: #777;
        }

        /* สไตล์สำหรับดาวกระจายที่ร่วงลงมา */
        .falling-star {
            position: absolute;
            top: -50px;
            font-size: 24px;
            animation: fallDown 1s linear forwards;
            z-index: 5;
            user-select: none;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* เอฟเฟกต์เฟดหน้าจอตอนท้าย */
        body.fade-out {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
    </style>
</head>
<body>

    <div class="welcome-card" onclick="goToBio()">
        <span class="bow">🎀</span>
        <div class="text">กดเพื่อไปต่อ</div>
    </div>

    <script>
        function goToBio() {
            // สร้างดาวกระจายร่วงลงมาหลายๆ ดวงพร้อมกัน
            for (let i = 0; i < 20; i++) {
                let star = document.createElement('div');
                star.className = 'falling-star';
                star.innerHTML = '✨'; // เปลี่ยนเป็นไอคอนอื่นได้ เช่น 🌟 หรือ 💫
                
                // สุ่มตำแหน่งซ้ายขวาและเวลาความเร็วในการร่วง
                star.style.left = Math.random() * window.innerWidth + 'px';
                star.style.animationDuration = (0.5 + Math.random() * 0.8) + 's';
                star.style.fontSize = (15 + Math.random() * 20) + 'px';
                
                document.body.appendChild(star);
            }

            // รอแป๊บเดียวให้ดาวร่วงแล้วค่อยเฟดเปลี่ยนหน้าไป bio.html
            setTimeout(function() {
                document.body.classList.add('fade-out');
            }, 500);

            setTimeout(function() {
                window.location.href = 'bio.html'; 
            }, 1100);
        }
    </script>

</body>
</html>
