<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome 🤍</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #faf8f5; /* โทนสีละมุนสะอาดตา */
            font-family: sans-serif;
            overflow: hidden;
        }

        .welcome-card {
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.6s ease, transform 0.3s ease;
        }

        .welcome-card:hover {
            transform: scale(1.08);
        }

        .bow {
            font-size: 75px;
            display: block;
            margin-bottom: 12px;
        }

        .text {
            font-size: 14px;
            letter-spacing: 2px;
            color: #777;
        }

        /* เอฟเฟกต์เฟดตอนกด */
        body.fade-out {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
    </style>
</head>
<body>

    <div class="welcome-card" onclick="goToBio()">
        <span class="bow">🎀</span>
        <div class="text">กดเพื่อไปต่อ</div>
    </div>

    <script>
        function goToBio() {
            // สั่งให้หน้าจอฟีด (Fade out) ก่อน
            document.body.classList.add('fade-out');
            
            // รอให้แอนิเมชันเล่นจบ 0.6 วิ แล้วค่อยเด้งไปหน้าต่อไป
            setTimeout(function() {
                // ตรง 'bio.html' ตรงนี้สามารถเปลี่ยนเป็นลิงก์หน้าเว็บไบโอหลักตัวจริงได้เลยนะ
                window.location.href = 'bio.html'; 
            }, 600);
        }
    </script>

</body>
</html>
