<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome 🫧❄️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color, #f4f8fb);
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ธีมสว่างและมืด */
        body.light-theme {
            --bg-color: #f4f8fb;
            --card-bg: #ffffff;
            --text-color: #1d3557;
            --sub-text: #6c757d;
            --meter-bg: #e2eafc;
            --tag-bg: #0077b6;
            --border-gradient: linear-gradient(135deg, #0077b6, #48cae4, #90e0ef);
            --card-shadow: 0 10px 30px rgba(0, 119, 182, 0.08);
        }

        body.dark-theme {
            --bg-color: #0b131f;
            --card-bg: #111d2d;
            --text-color: #e2eafc;
            --sub-text: #8d99ae;
            --meter-bg: #1d2d44;
            --tag-bg: #48cae4;
            --border-gradient: linear-gradient(135deg, #48cae4, #0077b6, #1d3557);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* เอฟเฟกต์หิมะตกฉากหลังตลอดเวลา */
        .ambient-snow {
            position: absolute;
            top: -20px;
            color: rgba(72, 202, 228, 0.6);
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fallDown linear infinite;
        }

        @keyframes fallDown {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .welcome-card {
            position: relative;
            background: var(--card-bg);
            padding: 50px 65px;
            border-radius: 30px;
            text-align: center;
            user-select: none;
            box-shadow: var(--card-shadow);
            z-index: 10;
            border: 2px solid transparent;
            background-image: linear-gradient(var(--card-bg), var(--card-bg)), 
                              var(--border-gradient);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            width: 340px;
        }

        .card-tag {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--tag-bg);
            color: #fff;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0, 119, 182, 0.3);
        }

        .theme-toggle {
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--sub-text);
            color: var(--text-color);
            font-size: 12px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .music-toggle {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            border: 2px solid var(--tag-bg);
            color: var(--text-color);
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: bold;
            z-index: 15;
        }

        .music-toggle:hover {
            background: var(--tag-bg);
            color: #fff;
        }

        .main-icon {
            font-size: 80px;
            display: inline-block;
            margin-bottom: 25px;
            filter: drop-shadow(0 5px 10px rgba(0,119,182,0.15));
            transition: transform 0.1s ease;
            cursor: pointer;
            position: relative;
        }
        
        .main-icon.active {
            transform: scale(1.15);
        }

        .text {
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--text-color);
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 20px;
        }

        .power-meter-container {
            width: 100%;
            height: 14px;
            background: var(--meter-bg);
            border-radius: 7px;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .power-meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0077b6, #48cae4);
            border-radius: 7px;
            transition: width 0.4s ease-out;
        }

        .click-instruction {
            font-size: 11px;
            color: var(--sub-text);
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .footer-text {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--sub-text);
            user-select: none;
            z-index: 10;
        }

        .scattered-snow {
            position: absolute;
            font-size: 32px;
            cursor: pointer;
            z-index: 20;
            animation: floatSlow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 8px rgba(0,119,182,0.2));
            transition: transform 0.2s, opacity 0.2s;
        }

        .scattered-snow:hover {
            transform: scale(1.3);
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(15deg); }
        }

        .exploding-star {
            position: absolute;
            font-size: 20px;
            animation: burstOut 0.8s ease-out forwards;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes burstOut {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.1) rotate(720deg); opacity: 0; }
        }

        .blizzard-storm {
            position: absolute;
            font-size: 24px;
            animation: stormSpin 1s linear forwards;
            z-index: 25;
            pointer-events: none;
        }

        @keyframes stormSpin {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--bx), var(--by)) scale(1.5) rotate(1080deg); opacity: 0; }
        }

        body.fade-out {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
    </style>
</head>
<body class="light-theme">

    <div class="welcome-card" id="welcomeCard">
        <button class="theme-toggle" id="themeToggleBtn" title="เปลี่ยนธีม">🌙</button>
        <div class="card-tag">WELCOME</div>
        
        <span class="main-icon" id="interactiveBtn">🫧</span>
        <div class="text" id="statusText">กำลังโหลดเวลา...</div>
        <div class="power-meter-container">
            <div class="power-meter-fill" id="powerFill"></div>
        </div>
        <div class="click-instruction" id="subInstruction">คลิกที่ฟองสบู่รัวๆ!</div>

        <!-- ปุ่มเปิด/ปิดเพลง ปล่อยดาว (ใช้วิธีฝัง iframe ซ่อนแบบเสถียร) -->
        <button class="music-toggle" id="musicToggleBtn">
            <span>🎧</span> <span id="musicStatusText">เปิดเพลง ปล่อยดาว</span>
        </button>
    </div>

    <!-- ซ่อนไอเฟรมเพลง YouTube แบบปลอดภัย -->
    <div id="audioPlayerContainer" style="display:none;">
        <iframe id="youtubeAudio" width="1" height="1" src="" title="YouTube audio player" frameborder="0" allow="autoplay"></iframe>
    </div>

    <div class="footer-text">est. 2026  ·  made with ♡</div>

    <script>
        // ควบคุมเพลงพื้นหลังแบบปลอดภัย
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicStatusText = document.getElementById('musicStatusText');
        const youtubeAudio = document.getElementById('youtubeAudio');
        let isMusicPlaying = false;

        musicToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // ป้องกันไม่ให้คลิกทะลุไปโดนการ์ด
            if (!isMusicPlaying) {
                // ใส่ autoplay=1 เพื่อให้เพลงเล่นทันทีเมื่อกด
                youtubeAudio.src = "https://www.youtube.com/embed/2fP6OLhBCSQ?autoplay=1&loop=1&playlist=2fP6OLhBCSQ";
                musicStatusText.innerText = 'ปิดเพลง 🎵';
                isMusicPlaying = true;
            } else {
                youtubeAudio.src = ""; // ปิดเพลงโดยการเคลียร์ src
                musicStatusText.innerText = 'เปิดเพลง ปล่อยดาว';
                isMusicPlaying = false;
            }
        });

        // ระบบสร้างหิมะโปรยฉากหลังตลอดเวลา
        function createAmbientSnow() {
            const snow = document.createElement('div');
            snow.className = 'ambient-snow';
            snow.innerHTML = Math.random() > 0.5 ? '❄️' : '✨';
            snow.style.left = Math.random() * 100 + 'vw';
            snow.style.fontSize = (12 + Math.random() * 16) + 'px';
            
            const duration = 4 + Math.random() * 6;
            snow.style.animationDuration = duration + 's';
            
            document.body.appendChild(snow);
            setTimeout(() => snow.remove(), duration * 1000);
        }
        setInterval(createAmbientSnow, 400);

        // ระบบเสียงเอฟเฟกต์สังเคราะห์ (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playChimeSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // ระบบทักทายตามเวลาจริง
        const statusText = document.getElementById('statusText');
        const subInstruction = document.getElementById('subInstruction');
        const hour = new Date().getHours();
        
        let timeGreeting = "จิ้มให้เต็ม...เพื่อไปต่อ";
        if (hour >= 0 && hour < 5) {
            timeGreeting = "ดึกมากแล้วนะ นอนยังเนี่ย 🌙";
        } else if (hour >= 5 && hour < 12) {
            timeGreeting = "อรุณสวัสดิ์! วันนี้ขอให้สดใสนะ ☀️";
        } else if (hour >= 12 && hour < 17) {
            timeGreeting = "ยามบ่ายแล้ว สู้ๆ นะ! ✨";
        } else if (hour >= 17 && hour < 21) {
            timeGreeting = "ค่ำแล้ว พักผ่อนกัน 🌆";
        } else {
            timeGreeting = "ดึกแล้วยังไม่นอนอีกนะเจ้ามนุษย์ 🌙";
        }
        statusText.innerText = timeGreeting;

        // ระบบสลับธีม Dark / Light Mode
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyTag = document.body;

        themeToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (bodyTag.classList.contains('light-theme')) {
                bodyTag.classList.remove('light-theme');
                bodyTag.classList.add('dark-theme');
                themeToggleBtn.innerText = '☀️';
            } else {
                bodyTag.classList.remove('dark-theme');
                bodyTag.classList.add('light-theme');
                themeToggleBtn.innerText = '🌙';
            }
        });

        // ควบคุมตรรกะการคลิกฟองสบู่และหิมะ
        const interactiveBtn = document.getElementById('interactiveBtn');
        const powerFill = document.getElementById('powerFill');
        const welcomeCard = document.getElementById('welcomeCard');

        let currentClick = 0;
        const maxPower = 10; 
        let phase = 1; 
        let snowCollected = 0;

        interactiveBtn.addEventListener('click', function() {
            if (phase !== 1) return; 

            playPopSound();
            interactiveBtn.classList.add('active');
            setTimeout(() => interactiveBtn.classList.remove('active'), 100);

            currentClick++;
            let fillProgress = (currentClick / maxPower) * 100;
            powerFill.style.width = fillProgress + '%';

            statusText.innerText = `สะสมพลัง (${currentClick}/10)`;

            if (currentClick >= maxPower) {
                phase = 2;
                interactiveBtn.innerText = '❄️';
                statusText.innerText = 'เอ๊ะ! มีเกล็ดหิมะหล่นมา 3 ดวง 🧊';
                subInstruction.innerText = 'จิ้มเก็บหิมะรอบๆ หน้าจอให้ครบสิ!';
                spawnSnowflakes();
            }
        });

        // ดับเบิลคลิกเพื่อเปิดโหมดพายุหิมะลับ
        welcomeCard.addEventListener('dblclick', function() {
            triggerBlizzardStorm();
        });

        function triggerBlizzardStorm() {
            playChimeSound();
            const cardRect = welcomeCard.getBoundingClientRect();
            const centerX = cardRect.left + cardRect.width / 2;
            const centerY = cardRect.top + cardRect.height / 2;

            for (let i = 0; i < 20; i++) {
                let stormParticle = document.createElement('div');
                stormParticle.className = 'blizzard-storm';
                stormParticle.innerHTML = Math.random() > 0.5 ? '❄️' : '🌪️';

                const angle = Math.random() * Math.PI * 2;
                const distance = 120 + Math.random() * 150;
                const bx = Math.cos(angle) * distance;
                const by = Math.sin(angle) * distance;

                stormParticle.style.setProperty('--bx', `${bx}px`);
                stormParticle.style.setProperty('--by', `${by}px`);
                stormParticle.style.left = centerX - 12 + 'px';
                stormParticle.style.top = centerY - 12 + 'px';

                document.body.appendChild(stormParticle);
                setTimeout(() => stormParticle.remove(), 1000);
            }
            statusText.innerText = 'ว้าว! เรียกพายุหิมะลับสำเร็จ 🌪️✨';
        }

        function spawnSnowflakes() {
            const coords = [
                { x: '18vw', y: '25vh' },
                { x: '75vw', y: '70vh' },
                { x: '78vw', y: '22vh' }
            ];

            coords.forEach((pos) => {
                let snow = document.createElement('div');
                snow.className = 'scattered-snow';
                snow.innerHTML = '❄️';
                snow.style.left = pos.x;
                snow.style.top = pos.y;

                snow.addEventListener('click', function() {
                    playChimeSound();
                    snow.remove();
                    snowCollected++;

                    if (snowCollected === 1) {
                        statusText.innerText = 'เก่งมาก เหลืออีก 2 ดวง 🤭';
                    } else if (snowCollected === 2) {
                        statusText.innerText = 'เกือบครบละ แอบเนียนนะเราอะ ✨';
                    } else if (snowCollected === 3) {
                        phase = 3;
                        statusText.innerText = 'เก็บครบแล้ว! ไปลุยกันต่อ 🚀';
                        subInstruction.innerText = 'กำลังพาไปหน้าไบโอ...';
                        
                        explodeStars();
                        
                        setTimeout(function() {
                            bodyTag.classList.add('fade-out');
                        }, 500);

                        setTimeout(function() {
                            window.location.href = 'bio.html';
                        }, 1100);
                    }
                });

                document.body.appendChild(snow);
            });
        }

        function explodeStars() {
            const cardRect = interactiveBtn.getBoundingClientRect();
            const centerX = cardRect.left + cardRect.width / 2;
            const centerY = cardRect.top + cardRect.height / 2;

            for (let i = 0; i < 25; i++) {
                let star = document.createElement('div');
                star.className = 'exploding-star';
                star.innerHTML = '✨';

                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                star.style.setProperty('--tx', `${tx}px`);
                star.style.setProperty('--ty', `${ty}px`);
                star.style.left = centerX - 10 + 'px';
                star.style.top = centerY - 10 + 'px';
                star.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';

                document.body.appendChild(star);

                setTimeout(() => {
                    star.remove();
                }, 1000);
            }
        }
    </script>

</body>
</html>
