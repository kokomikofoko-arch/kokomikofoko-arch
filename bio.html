<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome 🫧</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f8fb; /* พื้นหลังโทนฟ้าขาวละมุน */
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* กรอบการ์ดหลัก คุมโทนฟ้า-น้ำเงิน-ขาว-ดำ */
        .welcome-card {
            position: relative;
            background: #ffffff;
            padding: 50px 65px;
            border-radius: 30px;
            text-align: center;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0, 119, 182, 0.08);
            z-index: 10;
            border: 2px solid transparent;
            background-image: linear-gradient(#ffffff, #ffffff), 
                              linear-gradient(135deg, #0077b6, #48cae4, #90e0ef);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        /* ป้ายแท็กมุมการ์ด โทนฟ้า */
        .card-tag {
            position: absolute;
            top: -12px;
            right: 20px;
            background: #0077b6;
            color: #fff;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0, 119, 182, 0.3);
        }

        .bubble-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 25px;
            filter: drop-shadow(0 5px 10px rgba(0,119,182,0.15));
            transition: transform 0.1s ease;
            cursor: pointer;
        }
        
        /* เอฟเฟกต์ตอนกดที่ฟองสบู่ */
        .bubble-icon.active {
            transform: scale(1.15);
        }

        .text {
            font-size: 14px;
            letter-spacing: 2px;
            color: #1d3557;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* พื้นที่เกจพลัง โทนฟ้า */
        .power-meter-container {
            width: 100%;
            height: 14px;
            background: #e2eafc;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        /* หลอดพลังงานสีฟ้าไล่เฉด */
        .power-meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0077b6, #48cae4);
            border-radius: 7px;
            transition: width 0.4s ease-out;
        }

        .click-instruction {
            font-size: 11px;
            color: #6c757d;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        /* ข้อความ footer ด้านล่าง */
        .footer-text {
            position: absolute;
            bottom: 25px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #6c757d;
            user-select: none;
            z-index: 10;
        }

        /* ดาวกระจายที่ระเบิดออก */
        .exploding-star {
            position: absolute;
            font-size: 20px;
            animation: burstOut 0.8s ease-out forwards;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes burstOut {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.1) rotate(720deg);
                opacity: 0;
            }
        }

        /* เอฟเฟกต์เฟดหน้าจอตอนท้าย */
        body.fade-out {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="card-tag">WELCOME</div>
        <span class="bubble-icon" id="bubbleBtn">🫧</span>
        <div class="text">จิ้มให้เต็ม...เพื่อไปต่อ</div>
        <div class="power-meter-container">
            <div class="power-meter-fill" id="powerFill"></div>
        </div>
        <div class="click-instruction">คลิกที่ฟองสบู่รัวๆ!</div>
    </div>

    <div class="footer-text">est. 2026  ·  made with ♡</div>

    <script>
        const bubbleBtn = document.getElementById('bubbleBtn');
        const powerFill = document.getElementById('powerFill');
        const body = document.body;
        let currentPower = 0;
        const maxPower = 10; 
        let isCompleted = false;

        bubbleBtn.addEventListener('click', function() {
            if (isCompleted) return;

            this.classList.add('active');
            setTimeout(() => this.classList.remove('active'), 100);

            currentPower++;
            let percentage = (currentPower / maxPower) * 100;
            powerFill.style.width = percentage + '%';

            if (currentPower >= maxPower) {
                isCompleted = true;
                explodeStars();
                
                setTimeout(function() {
                    body.classList.add('fade-out');
                }, 500);

                setTimeout(function() {
                    window.location.href = 'bio.html';
                }, 1100);
            }
        });

        function explodeStars() {
            const cardRect = bubbleBtn.getBoundingClientRect();
            const centerX = cardRect.left + cardRect.width / 2;
            const centerY = cardRect.top + cardRect.height / 2;

            for (let i = 0; i < 25; i++) {
                let star = document.createElement('div');
                star.className = 'exploding-star';
                star.innerHTML = '✨';

                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                star.style.setProperty('--tx', `${tx}px`);
                star.style.setProperty('--ty', `${ty}px`);
                star.style.left = centerX - 10 + 'px';
                star.style.top = centerY - 10 + 'px';
                star.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';

                document.body.appendChild(star);

                setTimeout(() => {
                    star.remove();
                }, 1000);
            }
        }
    </script>

</body>
</html>
